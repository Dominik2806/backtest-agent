[project]
name = "backtest-agent"
version = "0.0.0"
description = "AI-assisted backtesting of trading strategies on a deterministic, tested engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
]

[project.scripts]
bt = "backtest_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `network` call real services and are excluded by default; run them with `uv run pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: calls real external services (yfinance); excluded by default, run with -m network",
]
